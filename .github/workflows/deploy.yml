name: Deploy Static Site via FTP na Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v3

      - name: Mostrar arquivos estáticos
        run: |
          echo "=== Estrutura do diretório public/static ==="
          ls -la public/static/ || echo "Pasta static não existe"
          echo "=== Arquivos HTML ==="
          find public/static -name "*.html" 2>/dev/null || echo "Nenhum HTML encontrado"

      - name: Deploy FTP para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./public/
          server-dir: /
          dangerous-clean-slate: true
          dry-run: false
          log-level: verbose
